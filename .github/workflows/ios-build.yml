name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive for iOS devices
        run: >-
          xcodebuild
          -project IOStest.xcodeproj
          -scheme IOStest
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath build/DerivedData
          -archivePath build/IOStest.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          archive

      - name: Package unsigned IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/IOStest.xcarchive/Products/Applications/IOStest.app build/ipa/Payload/
          (cd build/ipa && /usr/bin/zip -qry ../IOStest-unsigned.ipa Payload)

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IOStest-unsigned-IPA
          path: build/IOStest-unsigned.ipa
          if-no-files-found: error
